version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "06:15"
      timezone: America/Bogota
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "06:30"
      timezone: America/Bogota
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
