name: Bug report
description: Report reproducible incorrect behavior.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve quality.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: quality 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command, relevant quality.yml, and smallest reproducible project.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
