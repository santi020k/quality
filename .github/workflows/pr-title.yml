name: PR Title

on:
  pull_request:
    branches: [main]
    types: [edited, labeled, opened, reopened, synchronize, unlabeled]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  title:
    name: Lint PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate pull request title
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|chore|refactor|perf|test|ci|build|revert)([(][-a-z0-9._/]+[)])?!?:[[:space:]][^[:space:]A-Z].*$ ]]; then
            echo "::error::Use a Conventional Commit title, for example: feat: add repository-aware checks"
            exit 1
          fi
