name: Changeset

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changeset:
    name: User-visible changes are documented
    if: github.head_ref != 'changeset-release/main' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset status --since=origin/main
