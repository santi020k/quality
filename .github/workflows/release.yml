name: Release

on:
  push:
    branches: [main]
    paths:
      - crates/quality-cli/Cargo.toml
      - crates/quality-cli/package.json
      - packages/action/package.json
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      release: ${{ steps.release.outputs.release }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: release
        name: Resolve version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "quality-cli") | .version')
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          version_without_build=${version%%+*}
          case "$version_without_build" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            tag_sha=$(git rev-parse "refs/tags/${tag}^{commit}")
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Existing tag ${tag} does not point to the release commit ${GITHUB_SHA}."
              exit 1
            fi
          fi

          if [ "$version" = "0.0.0" ] || gh release view "$tag" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.release.outputs.release == 'true'
        with:
          node-version: 24
      - name: Prepare versioned release notes
        if: steps.release.outputs.release == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/prepare-release-notes.mjs "$VERSION" "$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.release.outputs.release == 'true'
        with:
          name: quality-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 7

  validate:
    name: Validate release candidate
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: clippy, rustfmt
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate

  build:
    name: Build ${{ matrix.target }}
    needs: [prepare, validate]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            format: tar
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            format: tar
          - os: macos-15
            target: aarch64-apple-darwin
            format: tar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            format: tar
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            format: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          targets: ${{ matrix.target }}
      - name: Build binary
        run: cargo build --locked --release --package quality-cli --target ${{ matrix.target }}

      - name: Package and smoke-test Unix binary
        if: matrix.format == 'tar'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          asset="quality-${TARGET}.tar.gz"
          mkdir -p release/package
          cp "target/${TARGET}/release/quality" release/package/quality
          cp LICENSE README.md release/package/
          tar -C release/package -czf "release/${asset}" quality LICENSE README.md
          (
            cd release
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$asset" > "${asset}.sha256"
            else
              shasum -a 256 "$asset" > "${asset}.sha256"
            fi
          )
          mkdir -p release/extracted release/init-smoke release/check-smoke
          tar -xzf "release/${asset}" -C release/extracted
          binary="$PWD/release/extracted/quality"
          test "$($binary --version)" = "quality ${VERSION}"

          "$binary" --root release/init-smoke init
          "$binary" --root release/init-smoke doctor --format json \
            > release/init-smoke/doctor.json
          jq -e '.schema_version == 1' release/init-smoke/doctor.json >/dev/null

          cat > release/check-smoke/quality.yml <<YAML
          version: 1
          output: pretty
          tools: {}
          tasks:
            archive:
              name: Extracted archive
              command: $binary
              args: [--version]
          YAML
          "$binary" --root release/check-smoke check --format json \
            --report "$PWD/release/check-smoke/quality.sarif" \
            > release/check-smoke/pass.json
          jq -e '.schema_version == 1' release/check-smoke/pass.json >/dev/null
          jq -e '.version == "2.1.0"' release/check-smoke/quality.sarif >/dev/null

          sed -i.bak 's/args: \[--version\]/args: [--invalid-release-smoke-flag]/' \
            release/check-smoke/quality.yml
          set +e
          "$binary" --root release/check-smoke check --format json \
            > release/check-smoke/fail.json
          smoke_exit=$?
          set -e
          test "$smoke_exit" -eq 1
          jq -e '.schema_version == 1' release/check-smoke/fail.json >/dev/null

      - name: Package and smoke-test Windows binary
        if: matrix.format == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $asset = "quality-$env:TARGET.zip"
          New-Item -ItemType Directory -Force release/package | Out-Null
          Copy-Item "target/$env:TARGET/release/quality.exe" release/package/quality.exe
          Copy-Item LICENSE,README.md release/package/
          Compress-Archive -Path release/package/* -DestinationPath "release/$asset"
          $hash = (Get-FileHash "release/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("release/$asset.sha256", "$hash  $asset`n")

          Expand-Archive -Path "release/$asset" -DestinationPath release/extracted
          $binary = (Resolve-Path release/extracted/quality.exe).Path
          $actualVersion = & $binary --version
          if ($actualVersion -ne "quality $env:VERSION") {
            throw "Unexpected version: $actualVersion"
          }

          New-Item -ItemType Directory -Force release/init-smoke,release/check-smoke | Out-Null
          & $binary --root release/init-smoke init
          & $binary --root release/init-smoke doctor --format json |
            Set-Content -Encoding utf8NoBOM release/init-smoke/doctor.json
          if ((Get-Content -Raw release/init-smoke/doctor.json | ConvertFrom-Json).schema_version -ne 1) {
            throw "Doctor report schema version is not 1"
          }

          @"
          version: 1
          output: pretty
          tools: {}
          tasks:
            archive:
              name: Extracted archive
              command: $($binary -replace '\\', '/')
              args: [--version]
          "@ | Set-Content -Encoding utf8NoBOM release/check-smoke/quality.yml
          $reportPath = (Join-Path (Get-Location) "release/check-smoke/quality.sarif")
          & $binary --root release/check-smoke check --format json --report $reportPath |
            Set-Content -Encoding utf8NoBOM release/check-smoke/pass.json
          if ($LASTEXITCODE -ne 0) { throw "Passing archive check failed" }
          if ((Get-Content -Raw release/check-smoke/pass.json | ConvertFrom-Json).schema_version -ne 1) {
            throw "Check report schema version is not 1"
          }
          if ((Get-Content -Raw $reportPath | ConvertFrom-Json).version -ne "2.1.0") {
            throw "SARIF version is not 2.1.0"
          }

          (Get-Content -Raw release/check-smoke/quality.yml).Replace(
            "args: [--version]",
            "args: [--invalid-release-smoke-flag]"
          ) | Set-Content -Encoding utf8NoBOM release/check-smoke/quality.yml
          & $binary --root release/check-smoke check --format json |
            Set-Content -Encoding utf8NoBOM release/check-smoke/fail.json
          if ($LASTEXITCODE -ne 1) { throw "Failing archive check did not exit 1" }
          if ((Get-Content -Raw release/check-smoke/fail.json | ConvertFrom-Json).schema_version -ne 1) {
            throw "Failure report schema version is not 1"
          }
          exit 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: release/quality-*
          if-no-files-found: error
          retention-days: 7

  prepublish-smoke:
    name: Verify staged Action and release
    needs: [prepare, validate, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-x86_64-unknown-linux-gnu
          path: staged
      - name: Serve staged release assets
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p "server/releases/download/${TAG}"
          cp staged/* "server/releases/download/${TAG}/"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory server >server.log 2>&1 &
          echo "$!" > server.pid
          curl --fail --retry 5 --retry-connrefused --retry-delay 1 \
            "http://127.0.0.1:8765/releases/download/${TAG}/quality-x86_64-unknown-linux-gnu.tar.gz.sha256" \
            --output /dev/null
      - name: Run bundled Action against staged binary
        env:
          QUALITY_ACTION_REPOSITORY: ${{ github.repository }}
          QUALITY_RELEASE_BASE_URL: http://127.0.0.1:8765
          INPUT_VERSION: ${{ needs.prepare.outputs.tag }}
          INPUT_WORKING-DIRECTORY: smoke
          INPUT_CHANGED-ONLY: "false"
          INPUT_BASE: ""
          INPUT_REPORT-LEVEL: warning
          INPUT_FAIL-LEVEL: warning
          INPUT_REQUIRE-CHECKS: "true"
          INPUT_JOBS: "1"
          INPUT_TIMEOUT-SECONDS: "30"
          INPUT_MAX-OUTPUT-BYTES: "1048576"
          INPUT_SARIF: quality.sarif
        run: |
          mkdir smoke
          printf '%s\n' \
            'version: 1' \
            'output: pretty' \
            'tools: {}' \
            'tasks:' \
            '  smoke:' \
            '    name: Staged release smoke test' \
            '    command: node' \
            '    args: [--version]' \
            > smoke/quality.yml
          touch action-outputs action-summary
          GITHUB_WORKSPACE="$PWD" \
          GITHUB_OUTPUT="$PWD/action-outputs" \
          GITHUB_STEP_SUMMARY="$PWD/action-summary" \
          RUNNER_TEMP="$RUNNER_TEMP" \
          RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" \
          node packages/action/dist/index.js
          test -s smoke/quality.sarif
          grep -q 'findings' action-outputs
          grep -q 'tools' action-outputs
          grep -q 'duration-ms' action-outputs
          grep -q 'Staged release smoke test' action-summary
      - name: Stop staged release server
        if: always()
        run: |
          if test -f server.pid; then
            kill "$(cat server.pid)" || true
          fi

  publish:
    name: Publish GitHub release
    needs: [prepare, build, prepublish-smoke]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-release-notes
          path: release-notes
      - name: Verify release assets
        run: |
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 10
          cd release
          sha256sum --check ./*.sha256
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
      - name: Ensure version tag matches release commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="$GITHUB_SHA" >/dev/null
          fi
          encoded_tag=$(jq --null-input --raw-output --arg tag "refs/tags/${TAG}" '$tag | @uri')
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${encoded_tag}" --jq '.sha')
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Tag ${TAG} does not point to the release commit ${GITHUB_SHA}."
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          test -s release-notes/release-notes.md
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes/release-notes.md \
            --prerelease="$PRERELEASE" \
            --latest=false \
            release/*

  action-smoke:
    name: Verify published Action
    needs: [prepare, publish]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (
        needs.publish.result == 'success' ||
        (needs.prepare.outputs.release == 'false' && needs.prepare.outputs.version != '0.0.0')
      )
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Verify published release commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          encoded_tag=$(jq --null-input --raw-output --arg tag "refs/tags/${TAG}" '$tag | @uri')
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${encoded_tag}" --jq '.sha')
          checkout_sha=$(git rev-parse HEAD)
          if [ "$tag_sha" != "$GITHUB_SHA" ] || [ "$checkout_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Published tag and Action checkout must match release commit ${GITHUB_SHA}."
            exit 1
          fi
      - name: Create smoke-test project
        run: |
          mkdir smoke
          printf '%s\n' \
            'version: 1' \
            'output: pretty' \
            'tools: {}' \
            'tasks:' \
            '  smoke:' \
            '    name: Release smoke test' \
            '    command: node' \
            '    args: [--version]' \
            > smoke/quality.yml
      - name: Run published release through the Action
        uses: ./
        env:
          QUALITY_ACTION_REPOSITORY: ${{ github.repository }}
        with:
          version: ${{ needs.prepare.outputs.tag }}
          working-directory: smoke
          changed-only: false

  promote-major-tag:
    name: Promote verified stable release
    needs: [prepare, action-smoke]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.action-smoke.result == 'success' &&
      needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Update stable major tag and latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const { GITHUB_REPOSITORY: repository, GITHUB_SHA: target, TAG: tag, VERSION: version } = process.env;

          function request(endpoint, optional = false) {
            const response = spawnSync('gh', ['api', '--include', endpoint], { encoding: 'utf8' });
            const status = response.stdout?.match(/^HTTP\/\S+ (\d{3})\b/)?.[1];
            if (optional && status === '404' && response.status !== 0) return null;
            if (response.status !== 0) {
              throw new Error(`Could not read ${endpoint}: ${response.error?.message || response.stderr.trim()}`);
            }
            const boundary = response.stdout.match(/\r?\n\r?\n/);
            if (!boundary || boundary.index === undefined) throw new Error(`Missing API response headers for ${endpoint}`);
            const data = JSON.parse(response.stdout.slice(boundary.index + boundary[0].length));
            if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error(`Invalid API response for ${endpoint}`);
            return data;
          }

          function stringField(data, field, description) {
            if (!data || typeof data[field] !== 'string' || !data[field]) throw new Error(`Missing ${description}`);
            return data[field];
          }

          function stableVersion(value) {
            const parsed = /^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.exec(value);
            if (!parsed) throw new Error(`Cannot compare non-stable version ${value}`);
            return { full: value.replace(/^v/, ''), core: parsed.slice(1, 4).map(BigInt) };
          }

          function compare(left, right) {
            for (let index = 0; index < 3; index += 1) {
              if (left.core[index] > right.core[index]) return 1;
              if (left.core[index] < right.core[index]) return -1;
            }
            return 0;
          }

          function tagCommit(name) {
            const ref = encodeURIComponent(`refs/tags/${name}`);
            return stringField(request(`repos/${repository}/commits/${ref}`), 'sha', `commit for ${name}`);
          }

          function mutate(args) {
            const result = spawnSync('gh', args, { encoding: 'utf8' });
            if (result.status !== 0) throw new Error(result.error?.message || result.stderr.trim() || 'Release promotion failed');
          }

          const candidate = stableVersion(version);
          if (tagCommit(tag) !== target) throw new Error(`Tag ${tag} changed after publication; refusing release promotion.`);
          const majorTag = `v${candidate.core[0]}`;
          let majorExists = false;
          let promoteMajor = false;
          if (candidate.core[0] > 0n) {
            const current = request(`repos/${repository}/git/ref/tags/${majorTag}`, true);
            majorExists = current !== null;
            promoteMajor = !majorExists;
            if (majorExists) {
              const currentSha = tagCommit(majorTag);
              const metadata = request(`repos/${repository}/contents/crates/quality-cli/package.json?ref=${encodeURIComponent(currentSha)}`);
              if (metadata.encoding !== 'base64') throw new Error(`Invalid package metadata encoding for ${majorTag}`);
              const content = stringField(metadata, 'content', `package metadata for ${majorTag}`);
              const currentVersion = stableVersion(stringField(JSON.parse(Buffer.from(content, 'base64').toString('utf8')), 'version', `package version for ${majorTag}`));
              if (currentVersion.core[0] !== candidate.core[0]) throw new Error(`Version behind ${majorTag} has the wrong major`);
              const order = compare(candidate, currentVersion);
              if (order === 0 && (currentSha !== target || currentVersion.full !== candidate.full)) {
                throw new Error(`Ambiguous equal-precedence version behind ${majorTag}; refusing release promotion.`);
              }
              promoteMajor = order > 0;
            }
          }

          const latest = request(`repos/${repository}/releases/latest`, true);
          let promoteLatest = latest === null;
          if (latest !== null) {
            const latestTag = stringField(latest, 'tag_name', 'latest release tag');
            const latestVersion = stableVersion(latestTag);
            const latestSha = tagCommit(latestTag);
            const order = compare(candidate, latestVersion);
            if (order === 0 && (latestSha !== target || latestTag !== tag)) {
              throw new Error('Ambiguous equal-precedence latest release; refusing release promotion.');
            }
            promoteLatest = order > 0;
          }

          // Resolve both pointers before changing either; a failed read must never authorize a write.
          if (promoteMajor) {
            if (majorExists) {
              mutate(['api', '--method', 'PATCH', `repos/${repository}/git/refs/tags/${majorTag}`, '-f', `sha=${target}`, '-F', 'force=true']);
            } else {
              mutate(['api', '--method', 'POST', `repos/${repository}/git/refs`, '-f', `ref=refs/tags/${majorTag}`, '-f', `sha=${target}`]);
            }
          } else {
            console.log(`Keeping the existing ${majorTag} alias.`);
          }
          if (promoteLatest) {
            mutate(['release', 'edit', tag, '--repo', repository, '--latest']);
          } else {
            console.log('Keeping the existing latest release.');
          }
          NODE
