name: Release

on:
  push:
    branches: [main]
    paths:
      - crates/quality-cli/Cargo.toml
      - crates/quality-cli/package.json
      - packages/action/package.json
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      release: ${{ steps.release.outputs.release }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: release
        name: Resolve version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "quality-cli") | .version')
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if [ "$version" = "0.0.0" ] || gh release view "$tag" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate release candidate
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy, rustfmt
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate

  build:
    name: Build ${{ matrix.target }}
    needs: [prepare, validate]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            format: tar
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            format: tar
          - os: macos-15
            target: aarch64-apple-darwin
            format: tar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            format: tar
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            format: zip
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}
      - name: Build binary
        run: cargo build --locked --release --package quality-cli --target ${{ matrix.target }}

      - name: Package and smoke-test Unix binary
        if: matrix.format == 'tar'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          asset="quality-${TARGET}.tar.gz"
          mkdir -p release/package
          cp "target/${TARGET}/release/quality" release/package/quality
          cp LICENSE README.md release/package/
          test "$(release/package/quality --version)" = "quality ${VERSION}"
          tar -C release/package -czf "release/${asset}" quality LICENSE README.md
          (
            cd release
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$asset" > "${asset}.sha256"
            else
              shasum -a 256 "$asset" > "${asset}.sha256"
            fi
          )

      - name: Package and smoke-test Windows binary
        if: matrix.format == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $asset = "quality-$env:TARGET.zip"
          New-Item -ItemType Directory -Force release/package | Out-Null
          Copy-Item "target/$env:TARGET/release/quality.exe" release/package/quality.exe
          Copy-Item LICENSE,README.md release/package/
          $actualVersion = & release/package/quality.exe --version
          if ($actualVersion -ne "quality $env:VERSION") {
            throw "Unexpected version: $actualVersion"
          }
          Compress-Archive -Path release/package/* -DestinationPath "release/$asset"
          $hash = (Get-FileHash "release/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("release/$asset.sha256", "$hash  $asset`n")

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: release/quality-*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify release assets
        run: |
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 10
          cd release
          sha256sum --check ./*.sha256
      - name: Attest release archives
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            release/*

  action-smoke:
    name: Verify published Action
    needs: [prepare, publish]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Create smoke-test project
        run: |
          mkdir smoke
          printf '%s\n' \
            'version: 1' \
            'output: pretty' \
            'tools: {}' \
            'tasks:' \
            '  smoke:' \
            '    name: Release smoke test' \
            '    command: node' \
            '    args: [--version]' \
            > smoke/quality.yml
      - name: Run published release through the Action
        uses: ./
        env:
          QUALITY_ACTION_REPOSITORY: ${{ github.repository }}
        with:
          version: ${{ needs.prepare.outputs.tag }}
          working-directory: smoke
          changed-only: false
