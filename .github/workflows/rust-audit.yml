name: Rust Audit

on:
  pull_request:
    branches: [main]
    paths: ["**/Cargo.toml", Cargo.lock, ".github/workflows/rust-audit.yml"]
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    name: Rust dependency advisories
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Restore audit executable
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2
      - name: Install pinned audit tool
        run: |
          if [ "$(cargo-audit --version 2>/dev/null)" != "cargo-audit 0.22.2" ]; then
            cargo install cargo-audit --locked --version 0.22.2 --force
          fi
      - name: Reject vulnerable or unmaintained dependencies
        run: |
          test "$(cargo-audit --version)" = "cargo-audit 0.22.2"
          cargo audit --file Cargo.lock --deny warnings
