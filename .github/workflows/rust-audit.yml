name: Rust Audit

on:
  push:
    branches: [main]
    paths: ["**/Cargo.toml", Cargo.lock]
  pull_request:
    branches: [main]
    paths: ["**/Cargo.toml", Cargo.lock]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    name: Rust dependency advisories
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
