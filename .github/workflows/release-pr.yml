name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  changesets:
    name: Maintain release pull request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Respect deliberate release branches
        id: deliberate-release
        run: node scripts/check-release-preparation.mjs active
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.deliberate-release.outputs.active != 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.deliberate-release.outputs.active != 'true'
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        if: steps.deliberate-release.outputs.active != 'true'
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: steps.deliberate-release.outputs.active != 'true'
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        if: steps.deliberate-release.outputs.active != 'true'
        with:
          github-token: ${{ secrets.CHANGESETS_TOKEN || github.token }}
          version-script: pnpm run version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        env:
          HUSKY: 0
          npm_config_ignore_scripts: "true"
