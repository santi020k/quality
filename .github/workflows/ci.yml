name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./actions/setup-pnpm
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Restore Rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Check affected projects
        run: pnpm run ci
      - name: Check user-visible release note
        if: github.head_ref != 'changeset-release/main' && github.actor != 'dependabot[bot]'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_BRANCH" == release/v* ]]; then
            expected_version="${HEAD_BRANCH#release/v}"
            test "$(node -p "require('./crates/quality-cli/package.json').version")" = "$expected_version"
            test "$(node -p "require('./packages/action/package.json').version")" = "$expected_version"
            pnpm run check:versions
          else
            pnpm changeset status --since=origin/main
          fi

  docs-browser:
    name: Documentation browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./actions/setup-pnpm
        with:
          node-version: 24
      - name: Install Chromium
        run: pnpm --filter @quality/site exec playwright install --with-deps chromium
      - name: Build documentation
        run: pnpm --filter @quality/site build
      - name: Check navigation, themes, and accessibility
        run: pnpm test:site
