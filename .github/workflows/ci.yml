name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QUALITY_CI_BASE: ${{ github.event.pull_request.base.sha }}
  QUALITY_CI_FULL: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'changeset-release/') }}

jobs:
  ci:
    name: Affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./actions/setup-pnpm
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Restore Rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Check affected projects
        run: pnpm run ci --report "$RUNNER_TEMP/quality-ci.json"
      - name: Save validation timing and selection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-ci-plan
          path: ${{ runner.temp }}/quality-ci.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Check user-visible release note
        if: github.head_ref != 'changeset-release/main' && github.actor != 'dependabot[bot]'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_BRANCH" == release/v* ]]; then
            expected_version="${HEAD_BRANCH#release/v}"
            test "$(node -p "require('./crates/quality-cli/package.json').version")" = "$expected_version"
            test "$(node -p "require('./packages/action/package.json').version")" = "$expected_version"
            pnpm run check:versions
          else
            pnpm changeset status --since=origin/main
          fi

  docs-browser:
    name: Documentation browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./actions/setup-pnpm
        with:
          node-version: 24
          task-cache-path: .turbo/cache
          task-cache-key: docs-browser
      - name: Plan documentation checks
        id: plan
        run: pnpm run ci:plan --github-output
      - name: Install Chromium
        if: steps.plan.outputs.docs-browser == 'true'
        run: pnpm --filter @quality/site exec playwright install --with-deps chromium
      - name: Build documentation
        if: steps.plan.outputs.docs-browser == 'true'
        run: pnpm exec turbo run build --filter=@quality/site
      - name: Check navigation, themes, and accessibility
        if: steps.plan.outputs.docs-browser == 'true'
        run: pnpm test:site
