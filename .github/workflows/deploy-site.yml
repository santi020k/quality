name: Deploy Site

on:
  # Every main update must queue a candidate: a source-only commit can supersede
  # a documentation build before its final SHA check. Qualify narrower selection
  # before restoring path filters, or pending documentation can be dropped.
  push:
    branches: [main]
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-site-production
  cancel-in-progress: false

jobs:
  eligibility:
    name: Verify published release and source
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      eligible: ${{ steps.release.outputs.eligible }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # workflow_run uses the current default-branch SHA. Bind it once so docs
      # merged during a release can deploy after that release is verified.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Require a verified stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deployment-eligibility.mjs

  build:
    name: Build site
    needs: eligibility
    if: github.ref == 'refs/heads/main' && needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.eligibility.outputs.sha }}
          persist-credentials: false
      - uses: ./actions/setup-pnpm
        with:
          node-version: 24
      - run: pnpm --filter @quality/site build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-site
          path: apps/site/.astro-dist
          include-hidden-files: true
          if-no-files-found: error

  prepare-deploy-toolchain:
    name: Prepare deploy toolchain
    needs: eligibility
    if: github.ref == 'refs/heads/main' && needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.eligibility.outputs.sha }}
          persist-credentials: false
      - name: Restore lockfile-pinned deploy toolchain
        id: deploy-toolchain-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .deploy/wrangler-toolchain.tgz
          key: quality-deploy-toolchain-v1-${{ runner.os }}-node-24-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: ./actions/setup-pnpm
        if: steps.deploy-toolchain-cache.outputs.cache-hit != 'true'
        with:
          node-version: 24
          install: "false"
      - name: Install lockfile-pinned deploy toolchain
        if: steps.deploy-toolchain-cache.outputs.cache-hit != 'true'
        run: |
          pnpm --frozen-lockfile --ignore-scripts \
            --filter @quality-preset-e2e/quality-monorepo install
          expected_wrangler_version="$(node -p "require('./package.json').devDependencies.wrangler")"
          test "$(node_modules/.bin/wrangler --version)" = "$expected_wrangler_version"
          mkdir -p .deploy
          tar -czf .deploy/wrangler-toolchain.tgz package.json node_modules
      - name: Verify prepared deploy toolchain
        run: |
          test -s .deploy/wrangler-toolchain.tgz
          tar -tzf .deploy/wrangler-toolchain.tgz | grep -Fqx node_modules/.bin/wrangler

  deploy:
    name: Deploy site
    needs: [eligibility, build, prepare-deploy-toolchain]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.eligibility.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            pnpm-lock.yaml
            wrangler.jsonc
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-site
          path: apps/site/.astro-dist
      - name: Restore lockfile-pinned deploy toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .deploy/wrangler-toolchain.tgz
          key: quality-deploy-toolchain-v1-${{ runner.os }}-node-24-${{ hashFiles('pnpm-lock.yaml') }}
          fail-on-cache-miss: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Restore deploy toolchain
        run: tar -C .deploy -xzf .deploy/wrangler-toolchain.tgz
      - name: Check deployment is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.eligibility.outputs.sha }}
        run: |
          encoded_ref=$(jq -rn --arg ref 'refs/heads/main' '$ref | @uri')
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${encoded_ref}" --jq '.sha')
          if [ "$current_sha" = "$SOURCE_SHA" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main revision superseded this deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Load production deployment secrets from Infisical
        if: steps.current.outputs.ready == 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /github/deploy-site
      - name: Deploy to Cloudflare Workers
        if: steps.current.outputs.ready == 'true'
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          .deploy/node_modules/.bin/wrangler deploy
