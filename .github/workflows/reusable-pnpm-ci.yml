name: Reusable pnpm CI

on:
  workflow_call:
    inputs:
      command:
        description: Trusted repository command to execute after dependency installation.
        required: true
        type: string
      pnpm-version:
        description: Explicit pnpm version. Leave empty to read packageManager from package.json.
        default: ""
        type: string
      node-version:
        description: Node.js version used when node-version-file is empty.
        default: "24"
        type: string
      node-version-file:
        description: Repository-relative Node.js version file. Leave empty to use node-version.
        default: ""
        type: string
      working-directory:
        description: Directory used for dependency installation and the command.
        default: .
        type: string
      cache-dependency-path:
        description: Repository-relative pnpm lockfile path.
        default: pnpm-lock.yaml
        type: string
      task-cache-path:
        description: Optional task-output cache path, such as .turbo/cache. Leave empty to disable.
        default: ""
        type: string
      task-cache-key:
        description: Namespace used to isolate this job's task-output cache.
        default: task
        type: string
      task-cache-config-path:
        description: Repository-relative task-runner configuration included in the cache key.
        default: turbo.json
        type: string
      fetch-depth:
        description: Git history depth. Use zero when the command performs change detection.
        default: 1
        type: number
      runner:
        description: GitHub-hosted runner label.
        default: ubuntu-latest
        type: string
      timeout-minutes:
        description: Maximum job runtime.
        default: 30
        type: number
      playwright-browsers:
        description: Space-separated Playwright browsers to install, or empty to skip browser setup.
        default: ""
        type: string
      artifact-name:
        description: Diagnostic artifact name. Leave empty to disable artifact upload.
        default: ""
        type: string
      artifact-path:
        description: Newline-separated diagnostic paths uploaded when the command fails.
        default: ""
        type: string

permissions:
  contents: read

jobs:
  ci:
    name: pnpm CI
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false

      - name: Set up repository-declared pnpm
        if: inputs.pnpm-version == ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up explicit pnpm version
        if: inputs.pnpm-version != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Set up Node.js from version file
        if: inputs.node-version-file != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Set up Node.js version
        if: inputs.node-version-file == ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Restore task-output cache
        if: inputs.task-cache-path != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.task-cache-path }}
          key: task-${{ runner.os }}-${{ runner.arch }}-${{ inputs.task-cache-key }}-node-${{ inputs.node-version }}-${{ hashFiles(inputs.node-version-file) }}-${{ hashFiles(inputs.cache-dependency-path, inputs.task-cache-config-path) }}-${{ github.sha }}
          restore-keys: |
            task-${{ runner.os }}-${{ runner.arch }}-${{ inputs.task-cache-key }}-node-${{ inputs.node-version }}-${{ hashFiles(inputs.node-version-file) }}-${{ hashFiles(inputs.cache-dependency-path, inputs.task-cache-config-path) }}-
            task-${{ runner.os }}-${{ runner.arch }}-${{ inputs.task-cache-key }}-node-${{ inputs.node-version }}-${{ hashFiles(inputs.node-version-file) }}-

      - name: Install frozen workspace dependencies
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browsers
        if: inputs.playwright-browsers != ''
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ inputs.playwright-browsers }}-${{ hashFiles(inputs.cache-dependency-path) }}

      - name: Install Playwright browsers
        if: inputs.playwright-browsers != '' && steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ${{ inputs.working-directory }}
        env:
          PLAYWRIGHT_BROWSERS: ${{ inputs.playwright-browsers }}
        shell: bash
        run: |
          read -r -a browsers <<< "$PLAYWRIGHT_BROWSERS"
          pnpm exec playwright install --with-deps "${browsers[@]}"

      - name: Install Playwright system dependencies
        if: inputs.playwright-browsers != '' && steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: ${{ inputs.working-directory }}
        env:
          PLAYWRIGHT_BROWSERS: ${{ inputs.playwright-browsers }}
        shell: bash
        run: |
          read -r -a browsers <<< "$PLAYWRIGHT_BROWSERS"
          pnpm exec playwright install-deps "${browsers[@]}"

      - name: Run repository command
        working-directory: ${{ inputs.working-directory }}
        env:
          QUALITY_CI_COMMAND: ${{ inputs.command }}
        shell: bash
        run: bash -euo pipefail -c "$QUALITY_CI_COMMAND"

      - name: Upload failure diagnostics
        if: failure() && inputs.artifact-name != '' && inputs.artifact-path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
