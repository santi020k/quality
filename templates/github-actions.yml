name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    name: Code quality
    runs-on: __QUALITY_RUNNER__
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

__QUALITY_PROJECT_SETUP__

      - name: Install quality
        run: |
          __QUALITY_INSTALL_COMMAND__

      - name: Verify toolchain
        run: quality doctor

      - name: Run quality checks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            quality check --changed "origin/$BASE_REF" --format github --report quality.sarif
          else
            quality check --format github --report quality.sarif
          fi

      - name: Upload code-scanning results
        if: always() && hashFiles('quality.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: quality.sarif
