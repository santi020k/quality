[package]
name = "quality-cli"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
description = "One fast code-quality workflow for multi-platform projects"
license = "MIT"
readme = "../../README.md"
publish = false
keywords = ["lint", "swift", "kotlin", "android", "ci"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/santi020k/quality"
homepage = "https://quality-cli.santi020k.chatgpt.site"

[[bin]]
name = "quality"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.6"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
walkdir = "2.5"
which = "8.0"

[dev-dependencies]
tempfile = "3.20"
