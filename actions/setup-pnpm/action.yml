name: Set up pnpm workspace
description: Install the repository-declared pnpm version, Node.js and frozen workspace dependencies.
author: quality contributors

inputs:
  pnpm-version:
    description: Explicit pnpm version. Leave empty to read packageManager from package.json.
    default: ""
  node-version:
    description: Node.js version used when node-version-file is empty.
    default: "24"
  node-version-file:
    description: Repository-relative Node.js version file. Leave empty to use node-version.
    default: ""
  cache:
    description: Enable the pnpm dependency cache.
    default: "true"
  cache-dependency-path:
    description: Repository-relative lockfile path used for the pnpm cache key.
    default: pnpm-lock.yaml
  registry-url:
    description: Optional package registry URL forwarded to actions/setup-node for publishing workflows.
    default: ""
  task-cache-path:
    description: Optional task-output cache path, such as .turbo/cache. Leave empty to disable.
    default: ""
  task-cache-key:
    description: Namespace used to isolate this job's task-output cache.
    default: task
  task-cache-config-path:
    description: Repository-relative task-runner configuration included in the cache key.
    default: turbo.json
  install:
    description: Install dependencies with the frozen lockfile after setting up Node.js.
    default: "true"
  working-directory:
    description: Directory in which pnpm install runs.
    default: .

outputs:
  task-cache-hit:
    description: Whether the optional task-output cache restored an exact key.
    value: ${{ steps.task-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Set up repository-declared pnpm
      if: inputs.pnpm-version == ''
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        run_install: false

    - name: Set up explicit pnpm version
      if: inputs.pnpm-version != ''
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Set up Node.js from version file with cache
      if: inputs.node-version-file != '' && inputs.cache == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        registry-url: ${{ inputs.registry-url }}

    - name: Set up Node.js from version file
      if: inputs.node-version-file != '' && inputs.cache != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        registry-url: ${{ inputs.registry-url }}

    - name: Set up Node.js version with cache
      if: inputs.node-version-file == '' && inputs.cache == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        registry-url: ${{ inputs.registry-url }}

    - name: Set up Node.js version
      if: inputs.node-version-file == '' && inputs.cache != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - name: Restore task-output cache
      id: task-cache
      if: inputs.task-cache-path != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.task-cache-path }}
        key: task-${{ runner.os }}-${{ runner.arch }}-${{ inputs.task-cache-key }}-node-${{ inputs.node-version }}-${{ hashFiles(inputs.node-version-file, inputs.cache-dependency-path, inputs.task-cache-config-path) }}-${{ github.sha }}
        restore-keys: |
          task-${{ runner.os }}-${{ runner.arch }}-${{ inputs.task-cache-key }}-node-${{ inputs.node-version }}-${{ hashFiles(inputs.node-version-file, inputs.cache-dependency-path, inputs.task-cache-config-path) }}-
          task-${{ runner.os }}-${{ runner.arch }}-${{ inputs.task-cache-key }}-node-${{ inputs.node-version }}-

    - name: Install frozen workspace dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
