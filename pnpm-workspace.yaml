packages:
  - apps/*
  - crates/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Patch vulnerable versions pinned exactly by Satori and Miniflare.
overrides:
  'fflate@<0.7.5': 0.7.5
  'sharp@<0.35.5': 0.35.5

minimumReleaseAgeExclude:
  # Reviewed stable releases required by the Lumen upgrade and browser checks.
  - '@santi020k/lumen-astro@4.1.0'
  - '@santi020k/lumen-core@4.1.0'
  - '@santi020k/lumen@4.2.0'
  - astro@7.3.7
  - '@playwright/test@1.64.0'
  - playwright@1.64.0
  - playwright-core@1.64.0
  # OG 1.2 pins this reviewed renderer.
  - '@santi020k/og@1.2.0'
  - satori@0.36.0
