packages:
  - apps/*
  - crates/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Keep security fixes within each consumer's existing dependency major.
# See RELEASING.md for the reviewed advisories and removal criteria.
overrides:
  'fflate@<0.7.5': 0.7.5
  'sharp@<0.35.5': 0.35.5
  'launch-editor@<2.14.2': 2.14.2
  'zod@>=4.0.0 <4.6.6': 4.6.7
  'undici@>=6.0.0 <6.29.1': 6.29.1
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'undici@>=8.0.0 <8.12.2': 8.12.3
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9

minimumReleaseAgeExclude:
  # Reviewed stable releases required by the Lumen upgrade and browser checks.
  - '@santi020k/lumen-astro@5.2.0'
  - '@santi020k/lumen-core@5.2.0'
  - '@santi020k/lumen@5.2.0'
  - astro@7.4.12
  - '@playwright/test@1.65.1'
  - playwright@1.65.1
  - playwright-core@1.65.1
  # OG 1.2 pins this reviewed renderer.
  - '@santi020k/og@1.2.1'
  - satori@0.36.0
  - '@cloudflare/workerd-darwin-64@1.20261116.1'
  - '@cloudflare/workerd-darwin-arm64@1.20261116.1'
  - '@cloudflare/workerd-linux-64@1.20261116.1'
  - '@cloudflare/workerd-linux-arm64@1.20261116.1'
  - '@cloudflare/workerd-windows-64@1.20261116.1'
  - miniflare@5.20261116.0-beta
  - workerd@1.20261116.1
  - wrangler@4.163.0
