# yaml-language-server: $schema=https://quality-cli.santi020k.chatgpt.site/quality.schema.json
# quality.yml — this repository validates itself with its public CLI.
version: 1
output: pretty
baseline: .quality-baseline.json
tools:
  cargo-fmt:
    enabled: true
    required: true
  cargo-clippy:
    enabled: true
    required: true
  actionlint:
    enabled: true
    required: true
  astro-check:
    enabled: true
    required: true
  eslint:
    enabled: false
  prettier:
    enabled: false
tasks:
  action-typecheck:
    name: GitHub Action type-check
    command: pnpm
    working_directory: packages/action
    args: [run, check]
    extensions: [ts]
    config_files: [package.json, tsconfig.json, pnpm-lock.yaml]
